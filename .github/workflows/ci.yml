name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kvitto
          POSTGRES_USER: kvitto
          POSTGRES_PASSWORD: kvitto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kvitto -d kvitto"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://kvitto:kvitto@localhost:5432/kvitto
      WEBHOOK_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check schema drift
        run: alembic check
      - name: Test
        run: pytest -q
